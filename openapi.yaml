              schema: { $ref: "#/components/schemas/ReconcileContractStateResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access JWT with `kind: admin`, from `POST /api/admin/login` or
        `POST /api/admin/refresh`. An
        `X-API-Key` on any route in this spec always resolves to `kind: user`
        and is therefore rejected with 403 — admin access is JWT-only.

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string }
    PathVersion:
      name: version
      in: path
      required: true
      schema: { type: integer }
    PathJobId:
      name: jobId
      in: path
      required: true
      schema: { type: string }
    PathContractId:
      name: contractId
      in: path
      required: true
      schema: { type: string }
    QueryDocument:
      name: document
      in: query
      schema: { type: string, enum: [contract, certificate] }
    QueryFormat:
      name: format
      in: query
      schema: { type: string, enum: [pdf, html] }
    QueryRevisionId:
      name: revision_id
      in: query
      schema: { type: string }
      description: "\"\" = current revision. Note: snake_case, unlike most JSON bodies."
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 100, maximum: 500 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, default: 0 }
    DocPageSize:
      name: page_size
      in: query
      schema: { type: integer, default: 50, maximum: 100 }
      description: "Documents-catalog pagination uses snake_case query params."
    DocPageToken:
      name: page_token
      in: query
      schema: { type: string }
    PageTokenCamel:
      name: pageToken
      in: query
      schema: { type: string }
      description: "Backfill/reconciliation pagination uses camelCase query params (unlike Documents-catalog lists)."
    PageSizeCamel200:
      name: pageSize
      in: query
      schema: { type: integer, default: 50, maximum: 200 }

  responses:
    BadRequest:
      description: Malformed request (`InvalidArgument`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid credentials (`Unauthenticated`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not permitted — wrong `kind`, missing permission, or an API key on an admin route (`PermissionDenied`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource (`NotFound`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: State conflict — see the operation description for the specific typed `reason` values that apply here (`FailedPrecondition` / `AlreadyExists`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate-limited (`ResourceExhausted`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: A backend service was unreachable (`Unavailable`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    AdminVendorCallout:
      type: object
      properties:
        id: { type: string }
        eventId: { type: string }
        orgId: { type: string }
        category: { type: string }
        serviceKinds: { type: array, items: { type: string } }
        opensAt: { type: integer, format: int64, description: Unix seconds. }
        closesAt: { type: integer, format: int64, description: Unix seconds. }
        status: { type: string, enum: [open, closed, cancelled] }
    AdminCreateRecurringEventsRequest:
      type: object
      required: [title, startsAt, endsAt]
      properties:
        title: { type: string }
        description: { type: string }
        venueId: { type: string }
        startsAt: { type: integer, format: int64, description: Unix seconds. }
        endsAt: { type: integer, format: int64, description: Unix seconds. }
        currency: { type: string, description: Empty defaults to GHS. }
        recurrence:
          type: object
          properties:
            frequency: { type: string, enum: [daily, weekly, monthly], description: "Legacy recurrence." }
            interval: { type: integer, description: "Legacy interval; at least 1." }
            count: { type: integer, description: "Legacy occurrence count; 1 to 52." }
            pattern: { type: string, enum: [daily, weekly, monthly, quarterly, yearly, custom] }
            rule: { type: string, description: "RFC 5545 subset using FREQ, INTERVAL, BYDAY, BYMONTHDAY, BYMONTH, COUNT, and UNTIL." }
        categoryId: { type: integer, format: int32 }
        attendanceType: { type: string, enum: [in_person, virtual, hybrid] }
        countryCode: { type: string }
        subdivisionCode: { type: string }
        timezone: { type: string, description: "IANA zone used to evaluate the recurrence rule." }
        tags: { type: array, items: { type: string } }
        variantRule: { type: string, enum: [manual, publish_N_days_before, publish_on_sellout] }
        publishLeadDays: { type: integer, format: int32 }
        ticketTemplates:
          type: array
          items:
            type: object
            required: [name, priceMinor, total]
            properties:
              name: { type: string }
              priceMinor: { type: integer, format: int64 }
              total: { type: integer, format: int64 }
              saleStartOffsetSeconds: { type: integer, format: int64 }
              saleEndOffsetSeconds: { type: integer, format: int64 }
              admissionsPerUnit: { type: integer, format: int64 }
    AdminCreateRecurringEventsResponse:
      type: object
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/AdminEvent" }
          description: Parent event first, followed by its occurrences.
        seriesId: { type: string }
    AdminEvent:
      type: object
      properties:
        id: { type: string }
        orgId: { type: string }
        title: { type: string }
        description: { type: string }
        venueId: { type: string }
        startsAt: { type: integer, format: int64, description: Unix seconds. }
        endsAt: { type: integer, format: int64, description: Unix seconds. }
        currency: { type: string }
        status: { type: string, enum: [draft, published, cancelled, completed] }
        visibility: { type: string, enum: [public, private] }
        categoryId: { type: integer, format: int32 }
        attendanceType: { type: string }
        countryCode: { type: string }
        subdivisionCode: { type: string }
        timezone: { type: string }
        customSlug: { type: string }
        tags: { type: array, items: { type: string } }
        seriesId: { type: string, description: 'Recurring-series membership; empty when the event is not part of a series.' }
        parentEventId: { type: string }
        occurrenceKey: { type: string, description: 'Original local start, for example 2026-11-02T18:00:00.' }
        recurrencePattern: { type: string }
        recurrenceRule: { type: string }
        createdAt: { type: integer, format: int64, description: Unix seconds. }
        updatedAt: { type: integer, format: int64, description: Unix seconds. }
    AdminTicketType:
      type: object
      properties:
        id: { type: string }
        eventId: { type: string }
        name: { type: string }
        priceMinor: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        sold: { type: integer, format: int64 }
        status: { type: string }
        saleStartAt: { type: integer, format: int64, description: Unix seconds. }
        saleEndAt: { type: integer, format: int64, description: Unix seconds. }
    AdminOrder:
      type: object
      properties:
        id: { type: string }
