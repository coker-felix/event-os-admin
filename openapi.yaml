          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/contract-templates/{id}/versions/{version}/retire:
    post:
      tags: [Document Catalog]
      operationId: HandleAdminRetireContractTemplate
      summary: Retire a published template version
      description: Requires `admin.documents.templates.manage`. 409 `invalid_version_state` on a non-published version.
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - { $ref: "#/components/parameters/PathVersion" }
      responses:
        "200":
          description: Retired version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/document-settings:
    get:
      tags: [Document Catalog]
      operationId: HandleAdminGetDocumentSettings
      summary: Get the platform's signing-window settings
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/document-settings/signing-windows:
    put:
      tags: [Document Catalog]
      operationId: HandleAdminSetSigningWindow
      summary: Create or update a platform signing-window rule
      description: Requires `admin.documents.templates.manage`. `expectedRevision` 0 creates; otherwise it must match the current row (409 `stale_revision` on mismatch).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [relationship, hours]
              properties:
                relationship: { type: string }
                country: { type: string, description: "\"\" = every country." }
                hours: { type: integer }
                expectedRevision: { type: integer, format: int64 }
      responses:
        "200":
          description: The signing-window row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SigningWindow" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Document Catalog]
      operationId: HandleAdminDeleteSigningWindow
      summary: Delete a platform signing-window rule
      description: |
        Requires `admin.documents.templates.manage`. Unlike the PUT above,
        this reads its arguments from the **query string**, not a JSON body
        (`relationship`, `country`, `expected_revision` — note the snake_case
        here, unlike the PUT body's camelCase).
      parameters:
        - name: relationship
          in: query
          required: true
          schema: { type: string }
        - name: country
          in: query
          schema: { type: string }
        - name: expected_revision
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/document-artifacts:
    get:
      tags: [Document Catalog]
      operationId: HandleAdminListDocumentArtifacts
      summary: List document artifacts
      description: Requires `admin.documents.evidence.read`.
      parameters:
        - name: owner_type
          in: query
          schema: { type: string, enum: [contract_revision, invoice] }
        - name: owner_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Artifacts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifacts:
                    type: array
                    items: { $ref: "#/components/schemas/Artifact" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/document-artifacts/{id}/download:
    get:
      tags: [Document Catalog]
      operationId: HandleAdminDownloadDocumentArtifact
      summary: Get a short-lived download URL for a stored artifact
      description: Requires `admin.documents.evidence.read`. The URL expires after five minutes; each issued link is logged.
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      responses:
        "200":
          description: Download descriptor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactDownload" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/document-artifacts/{id}/legal-hold:
    put:
      tags: [Document Catalog]
      operationId: HandleAdminSetDocumentArtifactHold
      summary: Place or release a legal hold on an artifact
      description: Requires `admin.documents.operations.manage`. `reason` is required when placing a hold (400 otherwise).
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hold]
              properties:
                hold: { type: boolean }
                reason: { type: string }
      responses:
        "200":
          description: Updated artifact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/document-artifacts/{id}/tombstone:
    post:
      tags: [Document Catalog]
      operationId: HandleAdminTombstoneDocumentArtifact
      summary: Tombstone an artifact (queue it for deletion)
      description: |
        Requires `admin.documents.operations.manage`. `reason` is required
        (400 otherwise). Refused while the artifact is under legal hold
        (409 `legal_hold`) or still within its retention period
        (409 `retention_active`).
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string } }
      responses:
        "200":
          description: Tombstoned artifact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/document-retention-policies:
    get:
      tags: [Document Catalog]
      operationId: HandleAdminListDocumentRetentionPolicies
      summary: List retention policies
      description: Requires `admin.documents.operations.manage`.
      responses:
        "200":
          description: Policies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  policies:
                    type: array
                    items: { $ref: "#/components/schemas/RetentionPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    put:
      tags: [Document Catalog]
      operationId: HandleAdminSetDocumentRetentionPolicy
      summary: Create or update a retention policy
      description: Requires `admin.documents.operations.manage`. `expectedRevision` 0 creates; otherwise it must match (409 `stale_revision` on mismatch).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentType, retainDays]
              properties:
                country: { type: string, description: "\"\" = default." }
                documentType: { type: string }
                retainDays: { type: integer }
                legalBasis: { type: string }
                expectedRevision: { type: integer, format: int64 }
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionPolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/document-render-jobs:
    get:
      tags: [Document Catalog]
      operationId: HandleAdminListDocumentRenderJobs
      summary: List render jobs
      description: Requires `admin.documents.operations.manage`.
      parameters:
        - { $ref: "#/components/parameters/DocPageSize" }
        - { $ref: "#/components/parameters/DocPageToken" }
        - name: status
          in: query
          schema: { type: string, enum: [pending, done, dead] }
      responses:
        "200":
          description: Render jobs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/RenderJob" }
                  nextPageToken: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/document-render-jobs/{id}/retry:
    post:
      tags: [Document Catalog]
      operationId: HandleAdminRetryDocumentRenderJob
      summary: Revive a dead-lettered render job
      description: Requires `admin.documents.operations.manage`. `reason` is recorded with the retry.
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string } }
      responses:
        "200":
          description: The job, re-queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenderJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ---------------------------------------------------------------- Document Operations
  /api/admin/contracts:
    get:
      tags: [Document Operations]
      operationId: HandleAdminListContracts
      summary: List contracts across organizations
      description: Requires `admin.documents.operations.manage`. Results are paginated; pass the returned `nextPageToken` as `page_token` to continue.
      parameters:
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: page_token, in: query, schema: { type: string } }
        - { name: organization_id, in: query, description: Optional organization filter., schema: { type: string } }
      responses:
        "200":
          description: A page of contracts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  contracts:
                    type: array
                    items: { $ref: "#/components/schemas/Contract" }
                  nextPageToken: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/document-operations/contracts/{contractId}:
    get:
      tags: [Document Operations]
      operationId: HandleAdminGetDocumentContract
      summary: Inspect any contract
      description: Requires `admin.documents.operations.manage`. Unlike the party routes, this is not scoped to one organization.
      parameters:
        - { $ref: "#/components/parameters/PathContractId" }
      responses:
        "200":
          description: The contract.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/document-operations/contracts/{contractId}/download:
    get:
      tags: [Document Operations]
      operationId: HandleAdminDownloadDocumentContract
      summary: Get a short-lived download link for any contract's rendered document
      description: Requires `admin.documents.operations.manage`. Same semantics as the party-scoped download route (see the Organization API spec's "Contracts" section) but unrestricted by organization.
      parameters:
        - { $ref: "#/components/parameters/PathContractId" }
        - { $ref: "#/components/parameters/QueryDocument" }
        - { $ref: "#/components/parameters/QueryFormat" }
        - { $ref: "#/components/parameters/QueryRevisionId" }
      responses:
        "200":
          description: Download descriptor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactDownload" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/document-operations/contracts/{contractId}/resolve-blocked:
    post:
      tags: [Document Operations]
      operationId: HandleAdminResolveBlockedContract
      summary: Resolve a signature_blocked contract (admin path)
      description: |
        Requires `admin.documents.operations.manage`. `cancel` withdraws the
        contract; `replace_revision` issues a revision of identical content
        whose signer sets are the parties' current authorized signers (409
        if none is feasible), superseding the blocked revision's signatures.
        Nothing is ever marked signed; `reason` is required and audited.
        Idempotent by `operationId`.
      parameters:
        - { $ref: "#/components/parameters/PathContractId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveBlockedContractRequest" }
      responses:
        "200":
          description: Resolved contract.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/document-operations/lifecycle-events:
    get:
      tags: [Document Operations]
      operationId: HandleAdminListDocumentLifecycleEvents
      summary: List contract lifecycle delivery events
      description: |
        Requires `admin.documents.operations.manage`. Documents delivers each
        contract fact (issued, revised, executed, declined, expired,
        withdrawn, terminated, …) to the owning Vendors/Venues service, in
        order per contract. Oldest first.
      parameters:
        - { $ref: "#/components/parameters/DocPageSize" }
        - { $ref: "#/components/parameters/DocPageToken" }
        - name: state
          in: query
          schema: { type: string, enum: [pending, dead, delivered] }
        - name: contract_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/LifecycleEvent" }
                  nextPageToken: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/document-operations/lifecycle-events/{eventId}:
    get:
      tags: [Document Operations]
      operationId: HandleAdminGetDocumentLifecycleEvent
      summary: Inspect one lifecycle event
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LifecycleEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/document-operations/lifecycle-events/{eventId}/retry:
    post:
      tags: [Document Operations]
      operationId: HandleAdminRetryDocumentLifecycleEvent
      summary: Return a dead-lettered lifecycle event to delivery
      description: |
        Requires `admin.documents.operations.manage`. `reason` is required
        and audited. Never changes the event's facts. 409 on a `pending` or
        already-`delivered` (i.e. non-`dead`) event.
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string } }
      responses:
        "200":
          description: The event, re-queued for delivery.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LifecycleEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/document-operations/render-jobs:
    get:
      tags: [Document Operations]
      operationId: HandleAdminListDocumentOperationRenderJobs
      summary: List render jobs (operations console)
      description: Same shape as `GET /api/admin/document-render-jobs`; both exist for console navigation.
      parameters:
        - { $ref: "#/components/parameters/DocPageSize" }
        - { $ref: "#/components/parameters/DocPageToken" }
        - name: status
          in: query
          schema: { type: string, enum: [pending, done, dead] }
      responses:
        "200":
          description: Render jobs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/RenderJob" }
                  nextPageToken: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/document-operations/render-jobs/{jobId}/retry:
    post:
      tags: [Document Operations]
      operationId: HandleAdminRetryDocumentOperationRenderJob
      summary: Revive a dead-lettered render job (operations console)
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string } }
      responses:
        "200":
          description: The job, re-queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenderJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ---------------------------------------------------------------- Contract Backfills
  /api/admin/vendor-contract-backfills:
    post:
      tags: [Contract Backfills]
      operationId: HandleAdminStartVendorContractBackfill
      summary: Start a retroactive vendor onboarding-contract backfill
      description: |
        Requires `admin.documents.operations.manage`. `reason` is required.
        Only one job per service (vendors or venues) may be `running` or
        `paused` at a time — 409 otherwise. A background worker walks active
        vendors without a platform contract, in ID order, issuing each under
        the canonical `onboarding:vendor:<id>` operation; it never changes
        the vendor's status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                country: { type: string, description: "ISO 3166-1 alpha-2; \"\" = every country." }
                reason: { type: string }
      responses:
        "201":
          description: Job started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractBackfillJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
    get:
      tags: [Contract Backfills]
      operationId: HandleAdminListVendorContractBackfills
      summary: List vendor contract-backfill jobs
      description: Requires `admin.documents.operations.manage`. Newest first.
      parameters:
        - { $ref: "#/components/parameters/PageTokenCamel" }
        - { $ref: "#/components/parameters/PageSizeCamel200" }
      responses:
        "200":
          description: Jobs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/ContractBackfillJob" }
                  nextPageToken: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/vendor-contract-backfills/{jobId}:
    get:
      tags: [Contract Backfills]
      operationId: HandleAdminGetVendorContractBackfill
      summary: Get one vendor contract-backfill job's progress
      parameters:
        - { $ref: "#/components/parameters/PathJobId" }
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractBackfillJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/vendor-contract-backfills/{jobId}/pause:
    post:
      tags: [Contract Backfills]
      operationId: HandleAdminPauseVendorContractBackfill
      summary: Pause a running vendor backfill job
      description: 409 when the job isn't in a pausable state.
      parameters:
        - { $ref: "#/components/parameters/PathJobId" }
      responses:
        "200":
          description: The job, paused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractBackfillJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/vendor-contract-backfills/{jobId}/resume:
    post:
      tags: [Contract Backfills]
      operationId: HandleAdminResumeVendorContractBackfill
      summary: Resume a paused vendor backfill job
      description: 409 when the job isn't in a resumable state.
      parameters:
        - { $ref: "#/components/parameters/PathJobId" }
      responses:
        "200":
          description: The job, resumed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractBackfillJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/vendor-contract-backfills/{jobId}/retry:
    post:
      tags: [Contract Backfills]
      operationId: HandleAdminRetryVendorContractBackfill
      summary: Retry a vendor backfill job's failed profiles
      description: Re-queues failed profiles and reopens a completed job. 409 when the job isn't in a retryable state.
      parameters:
        - { $ref: "#/components/parameters/PathJobId" }
      responses:
        "200":
          description: The job, re-queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractBackfillJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/vendor-contract-backfills/{jobId}/results:
    get:
      tags: [Contract Backfills]
      operationId: HandleAdminListVendorContractBackfillResults
      summary: List a vendor backfill job's per-vendor results
      description: |
        By vendor ID. Skipped outcome details: `not_found`, `not_active`,
        `unclaimed`, `already_contracted`, `gate_off`, `changed_during_backfill`.
        Failures (`no_authorized_signer: …`, Documents errors) need action
        then a job-level retry.
      parameters:
        - { $ref: "#/components/parameters/PathJobId" }
        - name: outcome
          in: query
          schema: { type: string, enum: [pending, issued, skipped, failed] }
        - { $ref: "#/components/parameters/PageTokenCamel" }
        - { $ref: "#/components/parameters/PageSizeCamel200" }
      responses:
        "200":
          description: Results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/VendorContractBackfillResult" }
                  nextPageToken: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/venue-contract-backfills:
    post:
      tags: [Contract Backfills]
      operationId: HandleAdminStartVenueContractBackfill
      summary: Start a retroactive venue onboarding-contract backfill
      description: |
        Same rules as the vendor backfill above, applied to venues. Venues
        must also be claimed to be eligible; issues under
        `onboarding:venue:<id>`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                country: { type: string }
                reason: { type: string }
      responses:
        "201":
          description: Job started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractBackfillJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
    get:
      tags: [Contract Backfills]
      operationId: HandleAdminListVenueContractBackfills
      summary: List venue contract-backfill jobs
      parameters:
        - { $ref: "#/components/parameters/PageTokenCamel" }
        - { $ref: "#/components/parameters/PageSizeCamel200" }
      responses:
        "200":
          description: Jobs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/ContractBackfillJob" }
                  nextPageToken: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/venue-contract-backfills/{jobId}:
    get:
      tags: [Contract Backfills]
      operationId: HandleAdminGetVenueContractBackfill
      summary: Get one venue contract-backfill job's progress
      parameters:
        - { $ref: "#/components/parameters/PathJobId" }
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractBackfillJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/venue-contract-backfills/{jobId}/pause:
