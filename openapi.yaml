openapi: 3.0.3
info:
  title: Event OS — Admin API
  version: "1.0.0"
  license:
    name: Proprietary
    url: https://eventos.gh
  description: |
    Staff/back-office surface of the Event OS API gateway: platform configuration,
    KYC/KYB review, catalog administration, commerce rules, vendor/venue
    oversight, and the Documents contract-catalog/operations console.

    ## Authentication
    Every route below except `POST /api/admin/login` and
    `POST /api/admin/refresh` requires a **Bearer access token** whose claims
    carry `kind: admin` (see `BearerAuth`). Login returns an access token that
    expires in 15 minutes and a refresh token that expires in 30 days. Exchange
    the refresh token at `/api/admin/refresh` for a new token pair. Refresh
    tokens are stateless, so each issued refresh token remains valid until it
    expires.

    An `X-API-Key` header is also accepted by the gateway's authentication layer,
    but an API key always resolves to `kind: user`, never `kind: admin`. Every
    route in this spec therefore answers **403 Forbidden** to an API-key-bearing
    request, regardless of which permissions that key's owner holds. Admin access
    is JWT-only in practice.

    Beyond `kind: admin`, each route also requires a specific **permission**
    (e.g. `admin.config.manage`, `admin.kyc.review`, `admin.documents.operations.manage`),
    resolved server-side from the admin's assigned roles
    (see `GET /api/admin/admins/{id}/roles` and the Roles/Permissions catalog
    below). A JWT with `kind: admin` but a missing permission still gets
    **403 Forbidden** — the permission name is noted in each operation's
    description.

    ## Error model
    Every error body is `{"error": "<human-readable message>"}`, occasionally
    with an additional `"reason"` field for structured client handling. The
    gateway maps backend gRPC status codes to HTTP uniformly:

    | gRPC code | HTTP status |
    |---|---|
    | `InvalidArgument` | 400 |
    | `Unauthenticated` | 401 |
    | `PermissionDenied` | 403 |
    | `NotFound` | 404 |
    | `FailedPrecondition` / `AlreadyExists` | 409 |
    | `ResourceExhausted` | 429 |
    | `Unavailable` | 502 (backend service unreachable) |
    | anything else | 500 |

    Several Documents-catalog mutations return a **typed 409** whose `reason`
    is one of: `effective_range_overlap`, `template_not_publishable`,
    `stale_revision`, `invalid_version_state`, `retention_active`, `legal_hold`.

    ## Rate limiting
    Admin routes use a shared Redis token bucket of 600 requests per minute.
    Responses include `RateLimit-Limit`, `RateLimit-Remaining`, and
    `RateLimit-Reset`; rejected requests include `Retry-After` and return 429.
    Admin requests fail closed with 503 while Redis is unavailable.

    ## Pagination conventions (read carefully — they differ by subsystem)
    - **Documents-catalog lists** (platform legal identities, clauses, contract
      templates, document artifacts, retention policies, render jobs,
      lifecycle events) use **snake_case query parameters**: `page_size`
      (default 50, max 100) and `page_token`. The response carries
      `nextPageToken` (camelCase, protojson).
    - **Contract backfill jobs/results and profile↔org reconciliation lists**
      use **camelCase query parameters**: `pageToken` and `pageSize` (default
      50, max 200).
    - **Platform catalog lists** (countries, subdivisions, distribution
      channels, event categories) use `limit` (default 100, max 500) and
      `offset`.
    - A handful of simple admin lists (users, KYC profiles, admins, roles,
      permissions, tax/fee rules) return everything in one call — no pagination.

    ## Reason-required mutations
    Several mutations require a non-empty `reason` field and are audited:
    artifact legal holds and tombstones, render-job and lifecycle-event
    retries, contract `resolve-blocked`, vendor/venue managing-org resolution,
    and venue-claim decisions accept an optional `note` (not required). These
    are called out per operation below.
  contact:
    name: Event OS Platform Team
servers:
  - url: http://{host}:8080
    description: Local / docker-compose (ADDR=:8080)
    variables:
      host:
        default: localhost
        description: Local gateway hostname.
  - url: https://api.eventos.gh
    description: Production — placeholder; point this at the actual deployed gateway host.
security:
  - BearerAuth: []
tags:
  - name: Auth
    description: Admin credential login and token refresh.
  - name: Analytics
    description: Aggregate-only admin module overviews and chart data.
  - name: Users
    description: Consumer account administration.
  - name: Events
    description: Cross-organization event lifecycle, ticket-type, and order administration.
  - name: KYC
    description: KYC/KYB case review for organizations, vendors, and venues.
  - name: Platform Config
    description: Website configuration (site name, branding, support contacts).
  - name: Admins & Roles
    description: Staff accounts and the roles/permissions catalog.
  - name: Sponsors
    description: Admin override of the sponsor catalog.
  - name: Feature Flags
    description: Global feature-flag defaults.
  - name: Catalogs
    description: Supported countries/subdivisions, distribution channels, and event categories.
  - name: Tax & Commerce
    description: Tax rules, platform-fee rules, and commerce settings.
  - name: Payouts
    description: Cross-organization payout reads.
  - name: Vendors & Venues
    description: Vendor/venue status, directories, claims, and organization linking.
  - name: Document Catalog
    description: Platform legal identities, clauses, contract templates, signing windows, artifacts, and retention policies.
  - name: Document Operations
    description: Contract inspection, lifecycle-event delivery, and render-job operations.
  - name: Contract Backfills
    description: Retroactive onboarding-contract backfill jobs and on-demand reconciliation.

paths:
  /api/admin/analytics/{module}/overview:
    get:
      tags: [Analytics]
      operationId: HandleAdminModuleOverview
      summary: Get aggregate overview analytics for an admin module
      description: |
        Requires an admin JWT with `admin.analytics.read`. Returns aggregate
        metrics and graph-ready chart series for one navigation module. `from`
        is inclusive and `to` is exclusive; both are normalized to UTC. When
        omitted, the period is the previous 30 complete UTC days. Data gaps are
        represented by `freshnessStatus` and per-source status. An absent
        optional point value means unknown or suppressed; a value of zero is a
        known zero. Money is expressed in minor units with a separate series
        for each currency. The response contains no user-level records.

        Expected source services are Accounts: Identity, Vendors, Venues;
        Events: Events; Ticketing: Ticketing, Payments; Commerce: Platform,
        Payments; Marketplace: Vendors, Venues; Contracts: Documents, Vendors,
        Venues; Invoices: Vendors, Venues; Staff: Identity, Platform; Platform:
        Platform. If no stored snapshot covers the requested period, the API
        returns empty metrics/charts with `never_received`. If at least one
        source is present but another expected source is absent, status is
        `partial` and the missing source is listed. A source snapshot older
        than 36 hours is `stale`. Metric keys, units,
        chart IDs, and current coverage are defined in
        `docs/specs/admin-module-analytics.md`.
      parameters:
        - name: module
          in: path
          required: true
          description: Admin navigation module whose aggregate overview is requested.
          schema:
            type: string
            enum: [accounts, events, ticketing, commerce, marketplace, contracts, invoices, staff, platform]
        - name: from
          in: query
          required: false
          description: Inclusive RFC3339 period start. Provide together with `to`; offsets are accepted and normalized to UTC.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: Exclusive RFC3339 period end. Maximum range is 366 days.
          schema: { type: string, format: date-time }
        - name: granularity
          in: query
          required: false
          schema: { type: string, enum: [day, week, month], default: day }
      responses:
        "200":
          description: >-
            Aggregate module overview with source freshness for snapshots
            covering the requested period. If no snapshot covers it, the
            response has empty metrics/charts/sources and
            `freshnessStatus: never_received`.
          content:
            application/json:
              schema:
                type: object
                required: [module, generatedAt, from, to, granularity, freshnessStatus, metrics, charts]
                properties:
                  module: { type: string, enum: [accounts, events, ticketing, commerce, marketplace, contracts, invoices, staff, platform] }
                  generatedAt: { type: string, format: date-time }
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
                  granularity: { type: string, enum: [day, week, month] }
                  freshnessStatus: { type: string, enum: [current, stale, partial, never_received] }
                  sourceUpdatedAt: { type: string, format: date-time, nullable: true }
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        service: { type: string }
                        updatedAt: { type: string, format: date-time, nullable: true, description: Null when the expected source has not published a snapshot. }
                        revision: { type: integer, format: int64 }
                        status: { type: string, enum: [current, stale, missing] }
                  metrics:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        label: { type: string }
                        value: { type: number }
                        unit: { type: string }
                        currency: { type: string, description: ISO currency code for monetary metrics; empty for non-monetary metrics. }
                        numerator: { type: number }
                        denominator: { type: number }
                  charts:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        chartType: { type: string, enum: [line, bar, donut] }
                        unit: { type: string }
                        granularity: { type: string, enum: ["", day, week, month], description: Empty for category-only charts. }
                        dimension: { type: string }
                        series:
                          type: array
                          items:
                            type: object
                            properties:
                              key: { type: string }
                              label: { type: string }
                              currency: { type: string, description: ISO currency code for monetary series; empty otherwise. }
                              timePoints:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    timestamp: { type: string, format: date-time }
                                    value: { type: number, description: Optional. Omitted when unknown or suppressed; zero means known zero. }
                              categoryPoints:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    categoryKey: { type: string }
                                    categoryLabel: { type: string }
                                    value: { type: number, description: Optional. Omitted when unknown or suppressed; zero means known zero. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { description: Admin request infrastructure is unavailable, including Redis-backed rate limiting. }
        "500": { $ref: "#/components/responses/ServerError" }
  # ---------------------------------------------------------------- Auth
  /api/admin/login:
    post:
      tags: [Auth]
      operationId: HandleAdminLogin
      summary: Admin credential login
      description: |
        Public (no credentials). Exchanges an admin's email/password for an
        access and refresh token pair. The access token is a JWT with claims
        `kind: admin` and expires after 15 minutes. The refresh token expires
        after 30 days and is exchanged at `POST /api/admin/refresh`.
        The `token` response property is a backwards-compatible alias of
        `access_token`. Admin accounts are provisioned by another admin via
        `POST /api/admin/admins`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTokenPair" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503":
          description: Admin authentication is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/admin/refresh:
    post:
      tags: [Auth]
      operationId: HandleAdminRefresh
      summary: Refresh admin tokens
      description: |
        Public (no access token required). Exchanges a valid admin refresh
        token for a new access and refresh token pair. The access token expires
        after 15 minutes and the refresh token after 30 days. Refresh tokens are
        stateless; previously issued refresh tokens remain valid until expiry.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string, description: Refresh token returned by admin login or refresh. }
      responses:
        "200":
          description: Token refresh succeeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTokenPair" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: Admin token issuance is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ---------------------------------------------------------------- Users
  /api/admin/users:
    get:
      tags: [Users]
      operationId: HandleAdminListUsers
      summary: List consumer accounts
      description: Requires `admin.users.read`.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [guest, active, suspended] }
          description: Optional filter; "" lists every status.
      responses:
        "200":
          description: Users matching the filter.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Users]
      operationId: HandleAdminCreateUser
      summary: Onboard a consumer account
      description: Requires `admin.users.manage`. Same input shape as self-serve registration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                password: { type: string, format: password }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/organizations:
    get:
      tags: [Organizations]
      operationId: HandleAdminListOrganizations
      summary: List organizations
      description: Requires `admin.users.read`. Returns all organizations, newest first.
      responses:
        "200":
          description: Organizations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizations:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        type: { type: string, enum: [organizer, vendor, venue] }
                        ownerId: { type: string }
                        email: { type: string }
                        phone: { type: string }
                        address: { type: string }
                        status: { type: string }
                        kycStatus: { type: string }
                        createdAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Organizations]
      operationId: HandleAdminCreateOrganization
      summary: Create an organization for an existing account
      description: Requires `admin.users.manage`. The selected account becomes the organization owner and receives its owner membership. KYC remains pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerId, name, type]
              properties:
                ownerId: { type: string, description: Existing consumer account ID. }
                owner_id: { type: string, description: Existing consumer account ID; accepted for snake_case clients. }
                name: { type: string }
                type: { type: string, enum: [organizer, vendor, venue] }
                email: { type: string, format: email }
                phone: { type: string }
                address: { type: string }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, properties: { id: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/organization:
    post:
      tags: [Organizations]
      operationId: HandleAdminCreateOrganizationLegacyPath
      summary: Create an organization (singular path alias)
      description: Same behavior and permission as `POST /api/admin/organizations`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner_id, name, type]
              properties:
                owner_id: { type: string }
                name: { type: string }
                type: { type: string, enum: [organizer, vendor, venue] }
                email: { type: string, format: email }
                phone: { type: string }
                address: { type: string }
      responses:
        "201": { description: Created organization. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/users/{id}:
    get:
      tags: [Users]
      operationId: HandleAdminGetUser
      summary: Get one consumer account
      description: Requires `admin.users.read`. Admin reads carry provenance fields (`createdVia`, `createdByOrgId`) the consumer's own profile never exposes.
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/users/{id}/channels:
    get:
      tags: [Users]
      operationId: HandleAdminListUserChannels
      summary: List channels attributed to a consumer account
      description: Requires `admin.users.read`. Returns each observed interaction channel with its first and most recent use times.
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      responses:
        "200":
          description: Attributed channels.
          content:
            application/json:
              schema:
                type: object
                properties:
                  channels:
                    type: array
                    items:
                      type: object
                      properties:
                        channel: { type: string, enum: [web, app, whatsapp, ussd] }
                        firstSeenAt: { type: string, format: date-time }
                        lastSeenAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/users/{id}/status:
    patch:
      tags: [Users]
      operationId: HandleAdminSetUserStatus
      summary: Suspend or reactivate a consumer account
      description: Requires `admin.users.manage`.
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, suspended] }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string }, status: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ---------------------------------------------------------------- KYC
  /api/admin/kyc/profiles:
    get:
      tags: [KYC]
      operationId: HandleListKYC
      summary: List every KYC/KYB case
      description: Requires `admin.kyc.review`. Covers organization, vendor, and venue cases.
      responses:
        "200":
          description: All KYC profiles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items: { $ref: "#/components/schemas/KYCProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/kyc/profiles/{id}:
    get:
      tags: [KYC]
      operationId: HandleGetKYCProfile
      summary: Get a KYC case with its submitted documents
      description: Requires `admin.kyc.review`.
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      responses:
        "200":
          description: The case and its documents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { $ref: "#/components/schemas/KYCProfile" }
                  documents:
                    type: array
                    items: { $ref: "#/components/schemas/KYCDocument" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/kyc/profiles/{id}/decision:
    post:
      tags: [KYC]
      operationId: HandleDecideKYC
      summary: Approve or reject a KYC/KYB case
      description: |
        Requires `admin.kyc.review`. Approving a vendor/venue case is one of
        the triggers that can move its profile toward `active` (subject to
        the onboarding-contract gate — see `PATCH /api/admin/vendors/{id}/status`).
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, rejected] }
                note: { type: string }
      responses:
        "200":
          description: Decided.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { $ref: "#/components/schemas/KYCProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ---------------------------------------------------------------- Platform Config
  /api/admin/config:
    get:
      tags: [Platform Config]
      operationId: HandleAdminGetConfig
      summary: Read the website configuration
      description: Requires an admin session (read access is broader than `admin.config.manage`; any authenticated admin may read). The public mirror is `GET /api/config`.
      responses:
        "200":
          description: Current site configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    put:
      tags: [Platform Config]
      operationId: HandleAdminPutConfig
      summary: Replace the website configuration
      description: Requires `admin.config.manage`. Full replace — omitted fields clear to empty/zero.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutConfigRequest" }
      responses:
        "200":
          description: Updated configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ---------------------------------------------------------------- Admins & Roles
  /api/admin/admins:
    get:
      tags: [Admins & Roles]
      operationId: HandleListAdmins
      summary: List staff accounts
      description: Requires `admin.admins.manage`.
      responses:
        "200":
          description: Admins.
          content:
            application/json:
              schema:
                type: object
                properties:
                  admins:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Admins & Roles]
      operationId: HandleCreateAdmin
      summary: Onboard a staff account
      description: Requires `admin.admins.manage`. Super-admin-only in practice (every verb on this resource is).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/admins/{id}/status:
    patch:
      tags: [Admins & Roles]
      operationId: HandleSetAdminStatus
      summary: Suspend or reactivate a staff account
      description: Requires `admin.admins.manage`.
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { type: string } }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/admins/{id}:
    delete:
      tags: [Admins & Roles]
      operationId: HandleDeleteAdmin
      summary: Remove a staff account
      description: Requires `admin.admins.manage`.
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties: { deleted: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/admins/{id}/roles:
    get:
      tags: [Admins & Roles]
      operationId: HandleListAdminRoles
      summary: List a staff account's roles
      description: Requires `admin.admins.manage` or `admin.roles.manage`.
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      responses:
        "200":
          description: Roles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Admins & Roles]
      operationId: HandleAssignAdminRole
      summary: Grant a role to a staff account
      description: Requires `admin.roles.manage`.
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties: { roleId: { type: string } }
      responses:
        "200":
          description: Granted.
          content:
            application/json:
              schema:
                type: object
                properties: { adminId: { type: string }, roleId: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/admins/{id}/roles/{roleId}:
    delete:
      tags: [Admins & Roles]
      operationId: HandleRemoveAdminRole
      summary: Revoke a role from a staff account
      description: Requires `admin.roles.manage`.
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - name: roleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                properties: { deleted: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/roles:
    get:
      tags: [Admins & Roles]
      operationId: HandleListRoles
      summary: List the role catalog
      description: Requires `admin.roles.manage`.
      parameters:
        - name: scope
          in: query
          schema: { type: string }
          description: Optional filter (e.g. `platform`, `organizer`, `vendor`, `venue`). "" lists every scope.
      responses:
        "200":
          description: Roles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Admins & Roles]
      operationId: HandleCreateRole
      summary: Add a catalog role
      description: Requires `admin.roles.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope]
              properties:
                name: { type: string }
                scope: { type: string }
                description: { type: string }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/permissions:
    get:
      tags: [Admins & Roles]
      operationId: HandleListPermissions
      summary: List the permission catalog
      description: Requires `admin.roles.manage`.
      parameters:
        - name: scope
          in: query
          schema: { type: string }
          description: Optional filter. "" lists every scope.
      responses:
        "200":
          description: Permissions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items: { $ref: "#/components/schemas/Permission" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Admins & Roles]
      operationId: HandleCreatePermission
      summary: Add a catalog permission
      description: Requires `admin.roles.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope]
              properties:
                name: { type: string }
                scope: { type: string }
                description: { type: string }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/roles/{roleId}/permissions:
    get:
      tags: [Admins & Roles]
      operationId: HandleListRolePermissions
      summary: Read a role's current permission assignments
      description: Requires `admin.roles.manage`. Returns an empty permissions array when the role exists but has no assignments.
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current permissions assigned to the role.
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items: { $ref: "#/components/schemas/Permission" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Admins & Roles]
      operationId: HandleAssignPermission
      summary: Grant a permission to a role
      description: Requires `admin.roles.manage`.
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissionId]
              properties: { permissionId: { type: string } }
      responses:
        "200":
          description: Granted.
          content:
            application/json:
              schema:
                type: object
                properties: { roleId: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/roles/{roleId}/permissions/{permissionId}:
    delete:
      tags: [Admins & Roles]
      operationId: HandleRemovePermission
      summary: Revoke a permission from a role
      description: Requires `admin.roles.manage`.
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: string }
        - name: permissionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                properties: { deleted: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ---------------------------------------------------------------- Sponsors
  /api/admin/sponsors/{sponsorId}:
    patch:
      tags: [Sponsors]
      operationId: HandleAdminUpdateSponsor
      summary: Admin override — edit any sponsor catalog entry
      description: |
        Same effect as the organizer's `PATCH /api/organizations/{id}/sponsors/{sponsorId}`
        (documented in the Organization API spec) but admin-scoped, bypassing
        the creator-owns-it check events applies to organizer calls.
      parameters:
        - name: sponsorId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                logoUrl: { type: string, format: uri }
                websiteUrl: { type: string, format: uri }
      responses:
        "200":
          description: Updated sponsor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sponsor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Sponsors]
      operationId: HandleAdminDeleteSponsor
      summary: Admin override — delete any sponsor catalog entry
      parameters:
        - name: sponsorId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ---------------------------------------------------------------- Feature Flags
  /api/admin/feature-flags:
    get:
      tags: [Feature Flags]
      operationId: HandleListAdminFlags
      summary: List the flag registry with global defaults
      description: Requires `admin.config.manage`.
      responses:
        "200":
          description: Flags.
          content:
            application/json:
              schema:
                type: object
                properties:
                  flags:
                    type: array
                    items: { $ref: "#/components/schemas/Flag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/feature-flags/{flag}:
    put:
      tags: [Feature Flags]
      operationId: HandleSetAdminFlag
      summary: Flip a flag's global default
      description: |
        Requires `admin.config.manage`. This sets the platform-wide default
        only — it does not override a scope (org/vendor/venue/account) that
        already has its own override via the organization-scoped
        `PUT /api/organizations/{id}/feature-flags/{flag}` (Organization API spec).
      parameters:
        - name: flag
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties: { enabled: { type: boolean } }
      responses:
        "200":
          description: Updated flag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flag" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ---------------------------------------------------------------- Catalogs
  /api/admin/countries:
    get:
      tags: [Catalogs]
      operationId: HandleAdminListCountries
      summary: List every supported country, enabled or not
      description: Requires an admin session. The public mirror (`GET /api/v1/countries`) lists enabled-only.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Countries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  countries:
                    type: array
                    items: { $ref: "#/components/schemas/SupportedCountry" }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Catalogs]
      operationId: HandleAdminCreateCountry
      summary: Add a supported country
      description: Requires `admin.config.manage`. `code` is an immutable ISO 3166-1 alpha-2 identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, example: GH }
                name: { type: string }
                enabled: { type: boolean }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportedCountry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/countries/{code}:
    patch:
      tags: [Catalogs]
      operationId: HandleAdminUpdateCountry
      summary: Rename or enable/disable a country
      description: Requires `admin.config.manage`. `enabled` is required (400 if omitted). Disabling never invalidates existing references.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                name: { type: string }
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportedCountry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/countries/{code}/subdivisions:
    get:
      tags: [Catalogs]
      operationId: HandleAdminListSubdivisions
      summary: List a country's subdivisions, enabled or not
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Subdivisions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subdivisions:
                    type: array
                    items: { $ref: "#/components/schemas/SupportedSubdivision" }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Catalogs]
      operationId: HandleAdminCreateSubdivision
      summary: Add an ISO 3166-2 subdivision under a country
      description: Requires `admin.config.manage`. None are seeded; add them before tax rules need them.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
          description: The country code (ISO 3166-1 alpha-2) subdivisions are added under.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, example: GH-AA, description: "Full ISO 3166-2 code." }
                name: { type: string }
                enabled: { type: boolean }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportedSubdivision" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/subdivisions/{code}:
    patch:
      tags: [Catalogs]
      operationId: HandleAdminUpdateSubdivision
      summary: Rename or enable/disable a subdivision
      description: Requires `admin.config.manage`. `enabled` is required (400 if omitted).
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                name: { type: string }
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportedSubdivision" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/distribution-channels:
    get:
      tags: [Catalogs]
      operationId: HandleAdminListDistributionChannels
      summary: List the distribution-channel catalog
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Channels.
          content:
            application/json:
              schema:
                type: object
                properties:
                  distributionChannels:
                    type: array
                    items: { $ref: "#/components/schemas/DistributionChannel" }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Catalogs]
      operationId: HandleAdminCreateDistributionChannel
      summary: Add a distribution channel
      description: Requires `admin.config.manage`. `key` is an immutable identifier; `adapterType` is `website | ussd | whatsapp`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, displayName, adapterType]
              properties:
                key: { type: string }
                displayName: { type: string }
                adapterType: { type: string, enum: [website, ussd, whatsapp] }
                configRef: { type: string, description: Non-secret deployment configuration reference. }
                enabled: { type: boolean }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistributionChannel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/distribution-channels/{key}:
    patch:
      tags: [Catalogs]
      operationId: HandleAdminUpdateDistributionChannel
      summary: Update a distribution channel
      description: Requires `admin.config.manage`. `key` and `adapterType` are immutable; `enabled` is required (400 if omitted).
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                displayName: { type: string }
                configRef: { type: string }
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistributionChannel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/events:
    get:
      tags: [Events]
      operationId: HandleAdminListEvents
      summary: List events across organizations
      description: Requires `admin.events.read`. Results are ordered by start time and event ID.
      parameters:
        - { name: orgId, in: query, schema: { type: string }, description: Optional organization filter. }
        - { name: status, in: query, schema: { type: string, enum: [draft, published, cancelled, completed] } }
      responses:
        "200":
          description: Matching events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/AdminEvent" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/vendor-callouts:
    get:
      tags: [Events]
      operationId: HandleAdminListVendorCallouts
      summary: List open vendor callouts
      description: Requires `admin.events.read`. Returns callouts accepting vendor applications, with optional category filtering and offset pagination.
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Open callout page and total count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  callouts: { type: array, items: { $ref: "#/components/schemas/AdminVendorCallout" } }
                  total: { type: integer, format: int32 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/organizations/{orgId}/events:
    post:
      tags: [Events]
      operationId: HandleAdminCreateEvent
      summary: Create an event for an organization
      description: Requires `admin.events.manage`. The event remains owned by the path organization.
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, startsAt, endsAt]
              properties:
                title: { type: string }
                description: { type: string }
                venueId: { type: string }
                startsAt: { type: integer, format: int64 }
                endsAt: { type: integer, format: int64 }
                categoryId: { type: integer, format: int32 }
                attendanceType: { type: string }
                countryCode: { type: string }
                subdivisionCode: { type: string }
                timezone: { type: string }
                customSlug: { type: string }
                tags: { type: array, items: { type: string } }
      responses:
        "201":
          description: Event created as a draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/organizations/{orgId}/events/recurring:
    post:
      tags: [Events]
      operationId: HandleAdminCreateRecurringEvents
      summary: Create a recurring event series for an organization
      description: Requires `admin.events.manage`. Creates draft events using the organization's event settings and the supplied recurrence rule.
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCreateRecurringEventsRequest" }
      responses:
        "200":
          description: Created parent event and occurrences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCreateRecurringEventsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/events/{eventId}:
    get:
      tags: [Events]
      operationId: HandleAdminGetEvent
      summary: Get event details and ticket types
      description: Requires `admin.events.read`.
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Event details, including its ticket types.
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: "#/components/schemas/AdminEvent" }
                  ticketTypes: { type: array, items: { $ref: "#/components/schemas/AdminTicketType" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      tags: [Events]
      operationId: HandleAdminUpdateEvent
      summary: Edit an event
      description: Requires `admin.events.manage`; event validation and published schedule restrictions still apply.
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Same fields as organization event edits. }
      responses:
        "200":
          description: Updated event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/events/{eventId}/publish:
    post:
      tags: [Events]
      operationId: HandleAdminPublishEvent
      summary: Publish an event
      description: Requires `admin.events.manage`; organization activation, KYC, and ticket readiness gates remain enforced.
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Published event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/events/{eventId}/ticket-types:
    get:
      tags: [Events]
      operationId: HandleAdminListTicketTypes
      summary: List event ticket types
      description: Requires `admin.events.read`.
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Ticket types for the event.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticketTypes: { type: array, items: { $ref: "#/components/schemas/AdminTicketType" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Events]
      operationId: HandleAdminCreateTicketType
      summary: Add an event ticket type
      description: Requires `admin.events.manage`.
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Same fields as organization ticket-type creation. }
      responses:
        "201":
          description: Ticket type created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTicketType" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/events/{eventId}/ticket-types/{ticketTypeId}:
    patch:
      tags: [Events]
      operationId: HandleAdminUpdateTicketType
      summary: Edit a ticket type
      description: Requires `admin.events.manage`.
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string } }
        - { name: ticketTypeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Same fields as organization ticket-type edits. }
      responses:
        "200":
          description: Updated ticket type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTicketType" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Events]
      operationId: HandleAdminDeleteTicketType
      summary: Delete an unsold ticket type
      description: Requires `admin.events.manage`.
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string } }
        - { name: ticketTypeId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Ticket type deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/events/{eventId}/orders:
    get:
      tags: [Events]
      operationId: HandleAdminListEventOrders
      summary: List orders for an event
      description: Requires `admin.events.read`. Results are newest first and paginated.
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Paginated orders and total count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders: { type: array, items: { $ref: "#/components/schemas/AdminOrder" } }
                  total: { type: integer, format: int32 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/event-categories:
    get:
      tags: [Catalogs]
      operationId: HandleAdminListEventCategories
      summary: List every event category, including disabled
      description: The public mirror (`GET /api/v1/event-categories`) lists active-only.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Categories.
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items: { $ref: "#/components/schemas/EventCategory" }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Catalogs]
      operationId: HandleAdminCreateEventCategory
      summary: Add an event category
      description: Requires `admin.config.manage`. `slug` is derived from `name` server-side and is thereafter immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventCategory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/event-categories/{categoryId}:
    patch:
      tags: [Catalogs]
      operationId: HandleAdminUpdateEventCategory
      summary: Rename, redescribe, or enable/disable a category
      description: |
        Requires `admin.config.manage`. `categoryId` is a positive integer
        (400 otherwise). `active` is required (400 if omitted). A disabled
        category stays valid on events that already use it but cannot be
        newly assigned.
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                name: { type: string }
                description: { type: string }
                active: { type: boolean }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventCategory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ---------------------------------------------------------------- Tax & Commerce
  /api/admin/tax-rules:
    get:
      tags: [Tax & Commerce]
      operationId: HandleAdminListTaxRules
      summary: List tax rules
      description: Requires `admin.config.manage` (read also via `admin.config.read`).
      parameters:
        - name: country
          in: query
          schema: { type: string }
          description: ISO 3166-1 alpha-2 filter; omit for every country.
      responses:
        "200":
          description: Tax rules.
          content:
            application/json:
              schema:
                type: object
                properties:
                  taxRules:
                    type: array
                    items: { $ref: "#/components/schemas/TaxRule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Tax & Commerce]
      operationId: HandleAdminCreateTaxRule
      summary: Add a tax rule
      description: |
        Requires `admin.config.manage`. Rules are effective-dated
        (`effectiveFrom`, optional `effectiveTo`, unix seconds, half-open) and
        refuse to overlap another rule in the same scope (country/subdivision/
        supply kind/category/component) — 409 `effective_range_overlap`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaxRule" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/tax-rules/{id}:
    put:
      tags: [Tax & Commerce]
      operationId: HandleAdminUpdateTaxRule
      summary: Replace a tax rule's terms as a new version
      description: Requires `admin.config.manage`. Bumps `version` and keeps history; prior versions remain referenced by order snapshots.
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaxRule" }
      responses:
        "200":
          description: Updated (new version).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/fee-rules:
    get:
      tags: [Tax & Commerce]
      operationId: HandleAdminListFeeRules
      summary: List platform-fee rules
      parameters:
        - name: country
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Fee rules.
          content:
            application/json:
              schema:
                type: object
                properties:
                  feeRules:
                    type: array
                    items: { $ref: "#/components/schemas/FeeRule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Tax & Commerce]
      operationId: HandleAdminCreateFeeRule
      summary: Add a platform-fee rule
      description: Requires `admin.config.manage`. Effective-dated, half-open, refuses overlap in scope (409 `effective_range_overlap`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeeRule" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/fee-rules/{id}:
    put:
      tags: [Tax & Commerce]
      operationId: HandleAdminUpdateFeeRule
      summary: Replace a fee rule's terms as a new version
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeeRule" }
      responses:
        "200":
          description: Updated (new version).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/commerce-settings:
    get:
      tags: [Tax & Commerce]
      operationId: HandleAdminGetCommerceSettings
      summary: Get the platform default fee payer
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommerceSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    put:
      tags: [Tax & Commerce]
      operationId: HandleAdminSetCommerceSettings
      summary: Set the platform default fee payer
      description: Requires `admin.config.manage`. Applies to orders calculated afterwards only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommerceSettings" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommerceSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/organizations/{id}/commerce-profile:
    get:
      tags: [Tax & Commerce]
      operationId: HandleAdminGetOrgCommerceProfile
      summary: View an organization's fee-payer override and tax profile
      description: Requires an admin session (read also via `admin.config.read`). The organizer's own equivalent is `GET /api/organizations/{id}/commerce-profile` (Organization API spec).
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      responses:
        "200":
          description: Profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgCommerceProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/organizations/{id}/tax-exemptions/review:
    post:
      tags: [Tax & Commerce]
      operationId: HandleAdminReviewTaxExemption
      summary: Approve or reject an organization's tax-exemption evidence
      description: Requires `admin.kyc.review`. New or changed exemption evidence starts `pending` until reviewed here.
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country, status]
              properties:
                country: { type: string }
                subdivision: { type: string }
                status: { type: string, enum: [approved, rejected] }
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgCommerceProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ---------------------------------------------------------------- Payouts
  /api/admin/invoices:
    get:
      tags: [Invoices]
      operationId: HandleAdminListInvoices
      summary: List invoices across vendors and venues
      description: Requires `admin.invoices.read`. Supports cursor pagination and optional status or service-provider filters. Invoice status changes remain part of the booking and payment workflows.
      parameters:
        - { name: page_size, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 100 } }
        - { name: page_token, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [draft, issued, paid, overdue, voided, refunded] } }
        - { name: target_type, in: query, schema: { type: string, enum: [vendor, venue] } }
        - { name: target_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: A page of invoices.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices:
                    type: array
                    items: { $ref: "#/components/schemas/AdminInvoice" }
                  nextPageToken: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/invoices/{invoiceId}:
    get:
      tags: [Invoices]
      operationId: HandleAdminGetInvoice
      summary: Get invoice details
      description: Requires `admin.invoices.read`.
      parameters:
        - { name: invoiceId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Invoice details with its booking context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminInvoice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/payouts/{id}:
    get:
      tags: [Payouts]
      operationId: HandleAdminGetPayout
      summary: Read any payout for admin tooling
      description: Requires an admin session. Admins read across organizations — no org scoping check applies.
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      responses:
        "200":
          description: Payout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/admin/payouts:
    get:
      tags: [Payouts]
      operationId: HandleAdminListPayouts
      summary: List payouts across organizations
      description: Requires an admin session. Results are ordered by payout ID and support optional status filtering with offset pagination.
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: status, schema: { type: string, enum: [pending, processing, paid, failed, cancelled] } }
      responses:
        "200":
          description: Payout page and total count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payouts: { type: array, items: { $ref: "#/components/schemas/Payout" } }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ---------------------------------------------------------------- Vendors & Venues
  /api/admin/vendors:
    get:
      tags: [Vendors & Venues]
      operationId: HandleAdminListVendors
      summary: List vendor profiles
      description: Requires `admin.users.read`. Returns profiles across all statuses, ordered by business name with offset pagination.
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Vendor page and total count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  vendors: { type: array, items: { $ref: "#/components/schemas/Vendor" } }
                  total: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Vendors & Venues]
      operationId: HandleAdminCreateVendor
      summary: Create a vendor profile for an existing account
      description: Requires `admin.users.manage`. Creates the profile in `pending_approval` and opens the account's vendor KYC case. The account must not already have a vendor profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId, businessName, email]
              properties:
                accountId: { type: string, description: Existing consumer account ID. }
                businessName: { type: string }
                contactName: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                category: { type: string }
                city: { type: string }
                country: { type: string }
      responses:
        "201":
          description: Created pending vendor profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vendor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/vendors/{id}:
    get:
      tags: [Vendors & Venues]
      operationId: HandleAdminGetVendor
      summary: Get a vendor profile
      description: Requires `admin.users.read`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Vendor profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vendor" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/vendors/{id}/status:
    patch:
      tags: [Vendors & Venues]
      operationId: HandleAdminSetVendorStatus
      summary: Flip a vendor's status
      description: |
        Admin-only. When `onboarding_contracts` is enabled for the vendor (or
        its country), setting `active` issues the platform contract instead
        and the vendor becomes `pending_contract` (not listed, booked, or
        paid) until Documents reports that contract executed and KYC still
        passes — a direct `active` request in that state is 409, and
        `pending_contract` cannot be set directly (400). A profile with no
        verified managing organization, or whose organization has no
        authorized signer, gets 409.
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pending_approval, active, suspended] }
      responses:
        "200":
          description: Updated vendor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vendor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/vendors/{id}/tier:
    patch:
      tags: [Vendors & Venues]
      operationId: HandleAdminSetVendorTier
      summary: Assign a vendor's directory tier
      description: Admin-only.
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier]
              properties:
                tier: { type: string, enum: [normal, verified, partnered] }
      responses:
        "200":
          description: Updated vendor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vendor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/venues/{id}/status:
    patch:
      tags: [Vendors & Venues]
      operationId: HandleAdminSetVenueStatus
      summary: Flip a venue's status
      description: Same onboarding-contract gate as vendor status (see above), applied to venues; a venue must also be claimed.
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pending_approval, active, suspended] }
      responses:
        "200":
          description: Updated venue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Venue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/venues:
    get:
      tags: [Vendors & Venues]
      operationId: HandleAdminListVenues
      summary: List venue profiles
      description: Requires `admin.users.read`. Returns claimed and unclaimed venues across all statuses, ordered by name with offset pagination.
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Venue page and total count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  venues: { type: array, items: { $ref: "#/components/schemas/Venue" } }
                  total: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Vendors & Venues]
      operationId: HandleAdminCreateDirectoryVenue
      summary: Create an unclaimed directory venue
      description: |
        Requires `admin.config.manage`, behind the `venue_claims` flag. Set
        `confirmNotDuplicate: true` to force creation past a duplicate-name
        warning (same name/city/country as an existing venue).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CreateDirectoryVenueRequest"
      responses:
        "200":
          description: "Not created — duplicate candidates returned (resend with confirmNotDuplicate: true)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateDirectoryVenueResponse" }
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateDirectoryVenueResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/venues/{id}:
    get:
      tags: [Vendors & Venues]
      operationId: HandleAdminGetVenue
      summary: Get a venue profile
      description: Requires `admin.users.read`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Venue profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Venue" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/venues/{id}/ownership-history:
    get:
      tags: [Vendors & Venues]
      operationId: HandleAdminVenueOwnershipHistory
      summary: Get a venue's provenance and ownership event history
      description: Requires `admin.kyc.review`. Append-only (`created`, `claim_approved`, `migrated`).
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      responses:
        "200":
          description: Venue and its ownership events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  venue: { $ref: "#/components/schemas/Venue" }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/VenueOwnershipEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/venue-claims:
    get:
      tags: [Vendors & Venues]
      operationId: HandleAdminListVenueClaims
      summary: List venue claims for review
      description: Requires `admin.kyc.review`.
      parameters:
        - name: venueId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
      responses:
        "200":
          description: Claims.
          content:
            application/json:
              schema:
                type: object
                properties:
                  claims:
                    type: array
                    items: { $ref: "#/components/schemas/VenueClaim" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/venue-claims/{claimId}/approve:
    post:
      tags: [Vendors & Venues]
      operationId: HandleAdminApproveVenueClaim
      summary: Approve a venue claim
      description: |
        Requires `admin.kyc.review`. Atomically makes the claimant the owner,
        rejects competing pending claims on the same venue, and opens the
        claimant's venue KYC. The venue becomes `active` when KYB is already
        approved with evidence, otherwise `pending_approval`. If the claim
        named a `designatedOrgId`, that link is written as the venue's
        contracting-party link (ADR-0044); a claim without one leaves the
        venue in the profile→organization reconciliation queue.
      parameters:
        - name: claimId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { note: { type: string } }
      responses:
        "200":
          description: Approved — claim and the now-owned venue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  claim: { $ref: "#/components/schemas/VenueClaim" }
                  venue: { $ref: "#/components/schemas/Venue" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/venue-claims/{claimId}/reject:
    post:
      tags: [Vendors & Venues]
      operationId: HandleAdminRejectVenueClaim
      summary: Reject a venue claim
      description: Requires `admin.kyc.review`.
      parameters:
        - name: claimId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { note: { type: string } }
      responses:
        "200":
          description: Rejected claim.
          content:
            application/json:
              schema:
                type: object
                properties:
                  claim: { $ref: "#/components/schemas/VenueClaim" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/vendor-org-reconciliation:
    get:
      tags: [Vendors & Venues]
      operationId: HandleAdminListVendorOrgReconciliation
      summary: List vendor profiles whose managing organization is undecided
      description: Requires `admin.documents.operations.manage`. ID order, default page size 50, max 200.
      parameters:
        - { $ref: "#/components/parameters/PageTokenCamel" }
        - { $ref: "#/components/parameters/PageSizeCamel200" }
      responses:
        "200":
          description: Queued vendors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/VendorOrgReconciliation" }
                  nextPageToken: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/vendors/{id}/managing-org:
    post:
      tags: [Vendors & Venues]
      operationId: HandleAdminResolveVendorOrgLink
      summary: Record a vendor's managing organization
      description: |
        Requires `admin.documents.operations.manage`. `reason` is required
        (400 otherwise). The owner account must manage that active vendor-type
        organization (409 otherwise); already-linked-to-a-different-org is
        409. Repeating the same decision is idempotent. Never changes the
        vendor's status.
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [managingOrgId, reason]
              properties:
                managingOrgId: { type: string }
                reason: { type: string }
      responses:
        "200":
          description: The vendor's party read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolveVendorPartyResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/venue-org-reconciliation:
    get:
      tags: [Vendors & Venues]
      operationId: HandleAdminListVenueOrgReconciliation
      summary: List claimed venue profiles whose managing organization is undecided
      description: Requires `admin.documents.operations.manage`. ID order, default page size 50, max 200.
      parameters:
        - { $ref: "#/components/parameters/PageTokenCamel" }
        - { $ref: "#/components/parameters/PageSizeCamel200" }
      responses:
        "200":
          description: Queued venues.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/VenueOrgReconciliation" }
                  nextPageToken: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/venues/{id}/managing-org:
    post:
      tags: [Vendors & Venues]
      operationId: HandleAdminResolveVenueOrgLink
      summary: Record a claimed venue's managing organization
      description: Same rules as the vendor equivalent above, applied to venues.
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [managingOrgId, reason]
              properties:
                managingOrgId: { type: string }
                reason: { type: string }
      responses:
        "200":
          description: The venue's party read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolveVenuePartyResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }

