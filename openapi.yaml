        refresh_token: { type: string, description: Refresh JWT; expires after 30 days. }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, format: int64, example: 900, description: Access-token lifetime in seconds. }
        refresh_expires_in: { type: integer, format: int64, example: 2592000, description: Refresh-token lifetime in seconds. }

