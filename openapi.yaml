  /api/admin/contract-templates/{id}/versions/{version}:
    delete:
      tags: [Document Catalog]
      operationId: HandleAdminDeleteContractTemplateDraft
      summary: Delete a draft template version
      description: Requires `admin.documents.templates.manage`. Draft-only (409 `invalid_version_state` otherwise).
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - { $ref: "#/components/parameters/PathVersion" }
      responses:
        "200": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/contract-templates/{id}/versions/{version}/publish:
    post:
      tags: [Document Catalog]
      operationId: HandleAdminPublishContractTemplate
      summary: Publish a draft template version
      description: |
        Requires `admin.documents.templates.manage`. A template must be
        publishable (every required clause present, etc.) — 409
        `template_not_publishable` otherwise; 409 `effective_range_overlap`
        on a conflicting effective window.
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - { $ref: "#/components/parameters/PathVersion" }
      responses:
