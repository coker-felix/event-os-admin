  /api/admin/platform-legal-identities/{id}/versions/{version}/publish:
    post:
      tags: [Document Catalog]
      operationId: HandleAdminPublishPlatformLegalIdentity
      summary: Publish a draft version
      description: |
        Requires `admin.documents.legal_identities.manage`. Takes effect at
        the later of the draft's `effectiveFrom` and now; closes the
        identity's currently open published version at that instant.
        409 `effective_range_overlap` or `invalid_version_state` on conflict.
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - { $ref: "#/components/parameters/PathVersion" }
      responses:
        "200":
          description: Published version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformLegalIdentityVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
