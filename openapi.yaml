        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/vendor-contract-reconciliations:
    post:
      tags: [Contract Backfills]
      operationId: HandleAdminReconcileVendorContract
      summary: Force an on-demand vendor/booking contract reconciliation
      description: |
        Requires `admin.documents.operations.manage`. Pass exactly one of
        `bookingId` or `vendorId`. Vendors poll Documents' current facts for
        every booking/platform contract still open five minutes past its
        signing deadline and applies them by the same compare-and-set rules
        as delivered lifecycle events; this endpoint does the same on demand.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bookingId: { type: string }
                vendorId: { type: string }
      responses:
        "200":
          description: Reconciliation result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconcileContractStateResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/venue-contract-reconciliations:
    post:
      tags: [Contract Backfills]
      operationId: HandleAdminReconcileVenueContract
      summary: Force an on-demand venue/booking contract reconciliation
      description: Same as the vendor equivalent above, applied to venues. Pass exactly one of `bookingId` or `venueId`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bookingId: { type: string }
                venueId: { type: string }
      responses:
