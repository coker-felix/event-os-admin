  /api/admin/document-clauses/{id}/draft:
    put:
      tags: [Document Catalog]
      operationId: HandleAdminSaveDocumentClauseDraft
      summary: Replace the clause's draft version
      description: Requires `admin.documents.templates.manage`. Replaces the open draft, or creates the next version when none is in draft.
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveClauseDraftRequest" }
      responses:
        "200":
          description: The draft version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClauseVersion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/document-clauses/{id}/versions/{version}:
    delete:
      tags: [Document Catalog]
      operationId: HandleAdminDeleteDocumentClauseDraft
      summary: Delete a draft version
      description: Requires `admin.documents.templates.manage`. Draft-only — 409 `invalid_version_state` on a published/retired version.
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - { $ref: "#/components/parameters/PathVersion" }
      responses:
        "200": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
