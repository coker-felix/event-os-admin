        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/admin/document-clauses/{id}/versions/{version}/retire:
    post:
      tags: [Document Catalog]
      operationId: HandleAdminRetireDocumentClause
      summary: Retire a published clause version
      description: Requires `admin.documents.templates.manage`. 409 `invalid_version_state` on a non-published version.
