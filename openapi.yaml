      responses:
        "200":
          description: Templates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items: { $ref: "#/components/schemas/ContractTemplate" }
                  nextPageToken: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Document Catalog]
      operationId: HandleAdminCreateContractTemplate
      summary: Create a contract template shell
      description: Requires `admin.documents.templates.manage`.
      requestBody:
        required: true
